<title>The Lunchtable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee+Inline&family=Rubik+Glitch&family=Special+Elite&family=VT323&display=swap">
<style>
/* Layout: a sky poster with a beige CRT dead center, one sticker button on each side (stacked under it on phones). */
:root{
  --sky-deep:#0420a6; --sky:#1b66ff; --sky-lite:#79c0ff; --cloud:#ffffff; --cloud-shade:#c6dbff;
  --ink:#070b1c; --crt:#a6ffb8; --beige:#d9cfb6; --beige-dark:#b3a78a;
  --velvet:#8a0f24; --velvet-dark:#3d0610; --gold:#f4c24f; --pink:#ff4fa3; --yellow:#ffe34d;
  --f-display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --f-crt:'VT323','Courier New',monospace;
  --f-type:'Bungee Inline','Arial Black',sans-serif;
  --f-glitch:'Rubik Glitch',Impact,sans-serif;
  --f-doc:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky-deep);color:#fff;overflow:hidden;font-family:var(--f-doc);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}

/* sky + clouds */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#02138a 0%,#0636d6 38%,#1f78ff 72%,#6cb8ff 100%)}
.cloud{position:absolute;left:0;will-change:transform}
.puff{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#fff 0%,#fff 45%,var(--cloud-shade) 100%)}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-45vw)}to{transform:translateX(130vw)}}
#bgFx{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity 9s ease-in;
  background:repeating-linear-gradient(-35deg,var(--pink) 0 46px,var(--yellow) 46px 92px);background-size:200% 200%;}
#bgFx.on{opacity:1;animation:stripes 6s linear infinite}
@keyframes stripes{from{background-position:0 0}to{background-position:130px 0}}

/* page */
#page{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  column-gap:clamp(12px,3vw,48px);transition:opacity 1.4s ease}
#page.hide{opacity:0}
.pc-wrap{display:flex;justify-content:center}
.slot-l{justify-self:end}
.slot-r{justify-self:start}
.btn{font-family:var(--f-display);font-size:clamp(18px,2.3vw,30px);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);background:#fff;border:4px solid var(--ink);padding:.65em 1.05em;box-shadow:6px 6px 0 var(--ink);
  cursor:pointer;transform:rotate(-2.5deg);transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.slot-r .btn{transform:rotate(2.5deg)}
.btn:hover{transform:translate(-2px,-3px) rotate(-2.5deg);box-shadow:9px 10px 0 var(--ink);background:var(--yellow)}
.slot-r .btn:hover{transform:translate(-2px,-3px) rotate(2.5deg)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.codebar input:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}
.btn:disabled{opacity:.55;cursor:default}
@media (max-width:820px){
  #page{grid-template-columns:1fr 1fr;grid-template-areas:"pc pc" "b1 b2";align-content:center;row-gap:clamp(18px,4vh,34px)}
  .pc-wrap{grid-area:pc}.slot-l{grid-area:b1;justify-self:end}.slot-r{grid-area:b2;justify-self:start}
  .btn{font-size:clamp(15px,4.4vw,22px);padding:.6em .8em}
}

/* the computer */
.pc{--w:min(470px,80vw,56vh);width:var(--w);display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 20px 22px rgba(0,8,70,.6))}
.monitor{width:100%;background:linear-gradient(155deg,#eee5cd,var(--beige) 45%,var(--beige-dark));
  border-radius:8% 8% 5% 5%/7% 7% 4% 4%;padding:7% 7% 4%;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -6px 0 rgba(0,0,0,.18)}
.bezel{background:#26241d;border-radius:9%/8%;padding:5%;box-shadow:inset 0 0 0 3px #0c0c0a,inset 0 6px 14px #000}
.screen{aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:11%/9%;
  background:radial-gradient(ellipse at center,#12331d 0%,#04140b 78%);
  box-shadow:inset 0 0 34px #000,0 0 26px rgba(120,255,160,.28)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.14),transparent 55%)}
.screen-in{position:absolute;inset:0;padding:9% 10%;font-family:var(--f-crt);color:var(--crt);
  font-size:calc(var(--w)*.066);line-height:1.12;text-shadow:0 0 7px rgba(120,255,160,.85);animation:flick 5s infinite}
.screen-in .big{font-size:1.5em;letter-spacing:.04em;display:block;margin-bottom:.35em}
.screen-in .dim{opacity:.7}
.screen-in .typed{word-break:break-all}
.cur{display:inline-block;width:.55em;height:1em;background:var(--crt);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}97%{opacity:.9}}
.chin{display:flex;align-items:center;gap:4%;margin-top:5%;padding:0 3%}
.badge{font-family:var(--f-display);font-size:calc(var(--w)*.034);letter-spacing:.2em;color:#5b523b;
  border:2px solid #8f8566;padding:.15em .6em;border-radius:3px;background:linear-gradient(#cfc4a8,#bcb092)}
.led{width:calc(var(--w)*.025);height:calc(var(--w)*.025);border-radius:50%;background:#52ff7a;box-shadow:0 0 8px #52ff7a;margin-left:auto}
.drive{width:24%;height:calc(var(--w)*.022);background:#2c2a22;border-radius:3px;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.5)}
.neck{width:26%;height:calc(var(--w)*.05);background:linear-gradient(90deg,#a29679,#d6ccb2 40%,#a29679)}
.base{width:62%;height:calc(var(--w)*.05);border-radius:40% 40% 8% 8%/90% 90% 10% 10%;
  background:linear-gradient(#d6ccb2,#9c9073)}
.codebar{width:min(112%,540px);margin-top:calc(var(--w)*.045);display:flex;background:#1b1912;border:4px solid var(--ink);
  border-radius:10px;box-shadow:0 7px 0 rgba(0,0,0,.4),inset 0 0 0 2px #5b5440}
.codebar:focus-within{box-shadow:0 0 0 4px var(--yellow),0 7px 0 rgba(0,0,0,.4)}
.codebar input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--yellow);caret-color:var(--pink);
  font-family:var(--f-type);font-size:clamp(15px,3.1vw,23px);letter-spacing:.12em;text-transform:uppercase;padding:.7em .8em}
.codebar input::placeholder{color:#8d8467;opacity:1}
.codebar .go{background:var(--yellow);color:var(--ink);border:0;border-left:4px solid var(--ink);font-family:var(--f-display);
  letter-spacing:.1em;padding:0 1em;cursor:pointer;font-size:clamp(14px,2.6vw,19px);border-radius:0 5px 5px 0}
.codebar .go:hover{background:var(--pink)}
.codebar.nope{animation:nope .4s}
@keyframes nope{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* effect layers */
#tint{position:fixed;inset:0;z-index:30;pointer-events:none;background:rgba(20,200,70,.34);opacity:0;transition:opacity 1.2s}
#tint.on{opacity:1}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#fx *{pointer-events:none}
#fx .clickable{pointer-events:auto;cursor:pointer}
.fxfull{position:absolute;inset:0}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.shake{animation:shk .5s}
@keyframes shk{10%{transform:translate(-14px,8px)}30%{transform:translate(12px,-10px)}50%{transform:translate(-10px,-6px)}70%{transform:translate(8px,10px)}90%{transform:translate(-4px,2px)}}

/* credits */
#credits{position:fixed;inset:0;z-index:50;display:grid;place-items:center;visibility:hidden;pointer-events:none;
  padding-block:6vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#credits.on{visibility:visible;pointer-events:auto}
.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s cubic-bezier(.7,0,.2,1);z-index:2}
.lb-top{top:0}.lb-bot{bottom:0}
#credits.on .lb{height:12vh}
.dim-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,8,50,.55),rgba(0,0,10,.92));opacity:0;transition:opacity .9s}
#credits.on .dim-bg{opacity:1}
.beam{position:absolute;left:50%;top:-10%;width:60vmax;height:130%;transform:translateX(-50%) scaleX(0);transform-origin:top;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 80%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transition:transform 1s .1s}
#credits.on .beam{transform:translateX(-50%) scaleX(1)}
.reel{position:relative;z-index:1;width:min(600px,100%);max-height:74vh;overflow:auto;background:#0a0f26;color:#f4f1e6;
  border:4px solid #fff;box-shadow:0 0 0 8px var(--ink),0 0 60px rgba(120,190,255,.55);clip-path:inset(50% 0 50% 0);transition:clip-path 1.1s .45s cubic-bezier(.7,0,.2,1)}
#credits.on .reel{clip-path:inset(0 0 0 0)}
.reel-in{padding:clamp(22px,5vw,44px) clamp(26px,6vw,56px);position:relative}
.reel::before,.reel::after{content:"";position:sticky;display:block;height:0}
.sprockets{position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,#f4f1e6 0 10px,transparent 10px 24px);opacity:.85}
.sprockets.l{left:6px}.sprockets.r{right:6px}
.c-kicker{font-family:var(--f-crt);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--sky-lite);margin:0 0 4px;text-align:center}
.c-head{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,52px);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0;text-align:center}
.c-sub{font-family:var(--f-crt);font-size:24px;text-align:center;margin:0 0 14px;color:var(--yellow)}
.rows{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:9px}
.rows li{display:flex;align-items:baseline;gap:10px;font-size:clamp(15px,3.6vw,19px);opacity:0;transform:translateY(14px)}
.rows .lead{flex:1;border-bottom:2px dotted rgba(244,241,230,.4);transform:translateY(-4px);min-width:12px}
.rows .who{font-family:var(--f-display);letter-spacing:.05em;font-size:1.15em;text-transform:uppercase}
.rows .as{color:var(--sky-lite);text-align:right}
#credits.on .rows li{animation:rise .6s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.c-note{font-size:14px;line-height:1.5;text-align:center;color:#b9c5ee;margin:6px 0 20px;border-top:2px solid rgba(255,255,255,.2);padding-top:16px;opacity:0}
#credits.on .c-note{animation:rise .8s forwards}
.closebtn{display:block;margin:0 auto;font-size:18px;padding:.45em 1.2em}

/* release date collapse */
#collapse{position:fixed;inset:0;z-index:55;pointer-events:none;visibility:hidden}
#collapse.on{visibility:visible;pointer-events:auto}
.blackout{position:absolute;inset:0;background:#000;opacity:0}
.never{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:94%;text-align:center;
  font-family:var(--f-glitch);font-size:clamp(40px,10.5vw,120px);line-height:1;color:#fff;letter-spacing:.02em}
.never .ch{display:inline-block;opacity:0;filter:blur(18px);transform:translateY(30px) scale(1.6)}
.never .sp{display:inline-block;width:.3em}

/* curtains + intro */
#curtains{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.curtain{position:absolute;top:0;bottom:0;width:51%;transition:transform 2.8s cubic-bezier(.76,0,.24,1);
  background:repeating-linear-gradient(90deg,var(--velvet-dark) 0,var(--velvet) 5%,#b3162f 8%,var(--velvet) 11%,var(--velvet-dark) 15%)}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%,transparent 80%,rgba(0,0,0,.5))}
.curtain.l{left:0;box-shadow:12px 0 30px rgba(0,0,0,.6)}
.curtain.r{right:0;box-shadow:-12px 0 30px rgba(0,0,0,.6)}
#curtains.open .curtain.l{transform:translateX(-102%)}
#curtains.open .curtain.r{transform:translateX(102%)}
#intro{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity 1.2s}
#intro.out{opacity:0;pointer-events:none}
.leader{position:absolute;inset:0;display:grid;place-items:center;background:#d8d2c0;transition:opacity .15s}
.leader .ring{position:absolute;width:min(70vmin,520px);aspect-ratio:1;border-radius:50%;border:6px solid #2a2a2a;
  background:conic-gradient(from 0deg,rgba(0,0,0,.28) var(--a,0deg),transparent 0)}
.leader .ring::before,.leader .ring::after{content:"";position:absolute;background:#2a2a2a}
.leader .ring::before{left:50%;top:-12%;bottom:-12%;width:3px}
.leader .ring::after{top:50%;left:-12%;right:-12%;height:3px}
.leader .num{position:relative;font-family:var(--f-display);font-size:min(46vmin,340px);color:#2a2a2a}
.flyby{position:absolute;inset:0;background:linear-gradient(180deg,#010a6e,#0636d6 60%,#3b8dff);opacity:0;overflow:hidden}
.flyby .clouds{position:absolute;inset:-20%;transform-origin:center}
.title{position:relative;z-index:3;font-family:var(--f-display);font-size:clamp(46px,13vw,170px);line-height:.95;letter-spacing:.03em;
  text-align:center;text-transform:uppercase;color:#fff;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(255,255,255,.6);opacity:0}
.title span{display:inline-block;opacity:0;transform:scale(3.2) translateY(-40px)}
.title .sp{width:.3em}
.grain{position:absolute;inset:-50%;z-index:4;pointer-events:none;opacity:.14;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-4%)}75%{transform:translate(-2%,-3%)}100%{transform:translate(4%,2%)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5}
.skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:6;
  background:transparent;border:2px solid #fff;color:#fff;font-family:var(--f-crt);font-size:22px;letter-spacing:.1em;padding:.2em .8em;cursor:pointer}
.skip:hover{background:#fff;color:#000}
@media (prefers-reduced-motion:reduce){
  .drift{animation:none}.grain,.screen-in{animation:none}
}
</style>
